<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Water-IoT Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab { color: #2563eb; }
        .active-tab i { transform: translateY(-4px); transition: all 0.3s; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 text-slate-700 pb-24">

    <header class="bg-white p-4 shadow-sm sticky top-0 z-50 flex justify-between items-center px-6">
        <h1 class="font-bold text-lg text-blue-600 tracking-tight">
            <i class="fas fa-droplet mr-1"></i> WATER-IoT
        </h1>
        <div class="flex items-center space-x-2 bg-green-50 px-3 py-1 rounded-full border border-green-100">
            <span class="h-2 w-2 bg-green-500 rounded-full animate-pulse"></span>
            <span class="text-[10px] font-bold text-green-600 uppercase">Online</span>
        </div>
    </header>

    <main class="p-4 space-y-4">
        
        <div id="mobile-home" class="space-y-4">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 relative overflow-hidden">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <p class="text-slate-400 text-xs uppercase font-bold tracking-widest">Level Air</p>
                        <h2 class="text-4xl font-black text-slate-800">80<span class="text-xl font-medium">%</span></h2>
                    </div>
                    <div class="text-right">
                        <p class="text-slate-400 text-[10px] uppercase font-bold">Debit Air</p>
                        <p class="text-lg font-bold text-emerald-500">8.5 <span class="text-xs font-normal text-slate-400">L/m</span></p>
                    </div>
                </div>

                <div class="w-full h-48 bg-slate-50 rounded-2xl border-2 border-slate-100 relative overflow-hidden flex items-end">
                    <div class="w-full bg-blue-500 transition-all duration-1000 relative" style="height: 80%;">
                        <div class="absolute top-0 w-full h-2 bg-blue-300 opacity-50"></div>
                    </div>
                    <div class="absolute inset-0 flex flex-col justify-center items-center text-slate-400 opacity-20">
                        <i class="fas fa-water text-6xl"></i>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-6">
                    <div class="bg-slate-50 p-3 rounded-2xl">
                        <p class="text-[10px] text-slate-400 uppercase font-bold">Ketinggian</p>
                        <p class="font-bold text-slate-700 text-sm">64 cm</p>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl">
                        <p class="text-[10px] text-slate-400 uppercase font-bold">Estimasi</p>
                        <p class="font-bold text-slate-700 text-sm">12 Menit</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center justify-center space-y-2">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Pompa</p>
                    <input type="checkbox" checked class="w-12 h-6 bg-slate-200 rounded-full appearance-none checked:bg-blue-600 transition-all cursor-pointer relative after:content-[''] after:absolute after:w-5 after:h-5 after:bg-white after:rounded-full after:top-0.5 after:left-0.5 checked:after:left-6 after:transition-all">
                    <p class="text-[10px] font-bold text-blue-600 uppercase">Manual ON</p>
                </div>
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center justify-center space-y-2">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Status Tangki</p>
                    <div class="h-6 flex items-center">
                        <span class="text-blue-600 font-bold text-xs"><i class="fas fa-check-circle mr-1"></i> PENUH</span>
                    </div>
                    <p class="text-[10px] font-bold text-slate-300 uppercase italic">Aman</p>
                </div>
            </div>
        </div>

        <div id="mobile-settings" class="hidden space-y-4">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-6">
                <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest border-b pb-2">Konfigurasi Alat</h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Batas Matikan Pompa (%)</label>
                        <input type="number" value="95" class="w-full mt-1 p-3 bg-slate-50 rounded-xl border-none focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Batas Hidupkan Pompa (%)</label>
                        <input type="number" value="20" class="w-full mt-1 p-3 bg-slate-50 rounded-xl border-none focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>
                    <button onclick="alert('Settings Saved!')" class="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-lg shadow-blue-100 active:scale-95 transition-transform">
                        SIMPAN
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-logs" class="hidden space-y-3">
            <h3 class="font-bold text-slate-400 uppercase text-[10px] tracking-widest px-2">Aktivitas Terakhir</h3>
            <div class="space-y-2">
                <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border-l-4 border-blue-500">
                    <div>
                        <p class="text-xs font-bold">Pompa Mati Otomatis</p>
                        <p class="text-[10px] text-slate-400 font-mono">14:20 - Tangki 100%</p>
                    </div>
                    <i class="fas fa-check-circle text-blue-500"></i>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border-l-4 border-emerald-500">
                    <div>
                        <p class="text-xs font-bold">Pompa Hidup Otomatis</p>
                        <p class="text-[10px] text-slate-400 font-mono">13:45 - Tangki 20%</p>
                    </div>
                    <i class="fas fa-play-circle text-emerald-500"></i>
                </div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around p-3 z-50">
        <button onclick="showMobilePage('home')" id="tab-home" class="flex flex-col items-center space-y-1 active-tab">
            <i class="fas fa-chart-pie text-lg"></i>
            <span class="text-[10px] font-bold uppercase">Home</span>
        </button>
        <button onclick="showMobilePage('settings')" id="tab-settings" class="flex flex-col items-center space-y-1 text-slate-400">
            <i class="fas fa-sliders-h text-lg"></i>
            <span class="text-[10px] font-bold uppercase">Setup</span>
        </button>
        <button onclick="showMobilePage('logs')" id="tab-logs" class="flex flex-col items-center space-y-1 text-slate-400">
            <i class="fas fa-history text-lg"></i>
            <span class="text-[10px] font-bold uppercase">Logs</span>
        </button>
    </nav>

    <script>
        function showMobilePage(id) {
            // Sembunyikan semua halaman
            document.getElementById('mobile-home').classList.add('hidden');
            document.getElementById('mobile-settings').classList.add('hidden');
            document.getElementById('mobile-logs').classList.add('hidden');
            
            // Tampilkan halaman target
            document.getElementById('mobile-' + id).classList.remove('hidden');

            // Reset warna tab
            const tabs = ['home', 'settings', 'logs'];
            tabs.forEach(tab => {
                document.getElementById('tab-' + tab).classList.remove('active-tab');
                document.getElementById('tab-' + tab).classList.add('text-slate-400');
            });

            // Set tab aktif
            document.getElementById('tab-' + id).classList.add('active-tab');
            document.getElementById('tab-' + id).classList.remove('text-slate-400');
        }
    </script>
</body>
</html>
